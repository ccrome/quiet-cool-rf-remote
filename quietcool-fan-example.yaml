esphome:
  name: quietcool-fan
  friendly_name: QuietCool Fan

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Quietcool Fallback Hotspot"
    password: !secret ap_password

captive_portal:

# SPI bus configuration (adjust pins as needed for your hardware)
spi:
  clk_pin: 18
  mosi_pin: 23
  miso_pin: 19

external_components:
  - source:
      type: local
      path: components
    components: [quiet_cool]

fan:
  - platform: quiet_cool
    id: quietcool_fan_id
    name: QuietCool fan
    cs_pin: 15
    gdo0_pin: 13
    gdo2_pin: 12
    # Optional: omit remote_id and use the Pair Remote button instead
    # remote_id: [0x2D, 0xD4, 0x06, 0xCB, 0x00, 0xF7, 0xF2]
    # center_freq_mhz: 433.897
    # deviation_khz: 10
    # speed_count: 3  # 2 for LOW/HIGH fans, 3 for LOW/MEDIUM/HIGH

button:
  - platform: template
    name: "Pair Remote"
    on_press:
      - lambda: id(quietcool_fan_id).start_pairing();
  - platform: template
    name: "Query Fan State"
    on_press:
      - lambda: id(quietcool_fan_id).send_wake();
